<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard — Social Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ════ BASE PALETTE (light / default) ════ */
        :root {
            --bg:          #faf7f2;
            --surf:        #ffffff;
            --surf-2:      #f4f0e8;
            --border:      #e5ddd0;
            --border-hi:   #c9a96e;
            --acc:         #b5813a;
            --acc-soft:    #f5e6c8;
            --acc-deep:    #8a5e1e;
            --acc-glow:    rgba(181,129,58,0.18);
            --rose:        #d4a574;
            --rose-soft:   #fdf5ec;
            --sage:        #a8b89a;
            --sage-soft:   #f0f4ed;
            --txt-1:       #1c1610;
            --txt-2:       #5a4e3a;
            --txt-3:       #9e8e75;
            --nav-bg:      rgba(250,247,242,0.88);
            --font-head:   'Cormorant Garamond', serif;
            --font-body:   'Nunito', sans-serif;
            --radius:      18px;
            --radius-sm:   12px;
            --radius-xs:   8px;
        }

        /* ════ DARK THEME ════ */
        body.theme-dark {
            --bg:        #12100c;
            --surf:      #1c1914;
            --surf-2:    #26221a;
            --border:    rgba(201,169,110,0.12);
            --border-hi: rgba(201,169,110,0.4);
            --acc:       #c9943e;
            --acc-soft:  #3a2810;
            --acc-deep:  #e8b060;
            --acc-glow:  rgba(201,148,62,0.18);
            --txt-1:     #f0e8d8;
            --txt-2:     #b8a888;
            --txt-3:     #706050;
            --nav-bg:    rgba(18,16,12,0.92);
        }

        /* ════ BLUE THEME ════ */
        body.theme-blue {
            --bg:        #eef4ff;
            --surf:      #ffffff;
            --surf-2:    #dce9ff;
            --border:    #bdd4ff;
            --border-hi: #3b82f6;
            --acc:       #2563eb;
            --acc-soft:  #dbeafe;
            --acc-deep:  #1d4ed8;
            --acc-glow:  rgba(37,99,235,0.15);
            --txt-1:     #0f1d3a;
            --txt-2:     #2e4a8a;
            --txt-3:     #6b88c4;
            --nav-bg:    rgba(238,244,255,0.88);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            font-family: var(--font-body);
            color: var(--txt-1);
            min-height: 100vh; line-height: 1.65;
            background-image:
                radial-gradient(ellipse 80% 55% at 10% 0%,  rgba(201,169,110,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 45% at 90% 5%,  rgba(212,165,116,0.12) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 100%, rgba(168,184,154,0.10) 0%, transparent 55%);
            transition: background-color 0.3s;
        }

        /* ── NAVBAR ── */
        .sp-nav {
            position: sticky; top: 0; z-index: 200;
            background: var(--nav-bg);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 36px; height: 62px;
        }

        .sp-brand {
            display: flex; align-items: center; gap: 11px;
            font-family: var(--font-head); font-size: 22px; font-weight: 600;
            font-style: italic; color: var(--txt-1);
            text-decoration: none; letter-spacing: 0.1px;
        }
        .sp-brand-blossom {
            width: 32px; height: 32px; position: relative;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .sp-brand-blossom::before,
        .sp-brand-blossom::after {
            content: ''; position: absolute;
            width: 14px; height: 14px; border-radius: 50%;
            background: linear-gradient(135deg, #c9a96e, var(--rose));
        }
        .sp-brand-blossom::before { top: 2px; left: 2px; opacity: 0.8; }
        .sp-brand-blossom::after  { bottom: 2px; right: 2px; opacity: 0.6; }
        .sp-brand-blossom span { position: relative; z-index: 1; font-size: 15px; line-height: 1; }

        .sp-nav-right { display: flex; align-items: center; gap: 10px; }

        .sp-chip {
            display: flex; align-items: center; gap: 8px;
            background: var(--surf); border: 1px solid var(--border);
            border-radius: 40px; padding: 5px 16px 5px 7px;
            font-size: 13px; font-weight: 600; color: var(--txt-2);
        }
        .sp-chip-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #c9a96e, var(--rose));
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #fff;
        }

        .sp-logout {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 15px; border-radius: var(--radius-xs);
            border: 1px solid rgba(212,165,116,0.35);
            background: var(--rose-soft); color: #8c3a1c;
            font-family: var(--font-body); font-size: 13px; font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .sp-logout:hover { background: #fce5d0; border-color: rgba(212,165,116,0.6); color: #6b2010; }

        /* ── LAYOUT ── */
        .sp-wrap { max-width: 680px; margin: 0 auto; padding: 38px 20px 80px; }

        /* ── GREETING ── */
        .sp-greeting { margin-bottom: 28px; }
        .sp-greeting h1 {
            font-family: var(--font-head); font-size: 32px; font-weight: 600;
            font-style: italic; color: var(--txt-1); line-height: 1.2; letter-spacing: -0.3px;
        }
        .sp-greeting p { font-size: 14px; color: var(--txt-3); margin-top: 4px; font-weight: 500; }

        /* ── THEME SWITCHER ── */
        .theme-switcher {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 24px;
        }
        .theme-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
            text-transform: uppercase; color: var(--txt-3); margin-right: 2px;
        }
        .theme-dot {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid transparent; cursor: pointer;
            transition: transform 0.15s;
            text-decoration: none; display: block;
        }
        .theme-dot:hover { transform: scale(1.15); }
        .theme-dot.t-light { background: #faf7f2; border-color: #c9a96e; box-shadow: 0 0 0 1px #c9a96e; }
        .theme-dot.t-dark  { background: #1c1914; border-color: #6a5a40; box-shadow: 0 0 0 1px #6a5a40; }
        .theme-dot.t-blue  { background: #2563eb; border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }

        /* ── TABS ── */
        .sp-tabs {
            display: inline-flex; background: var(--surf);
            border: 1px solid var(--border); border-radius: 40px;
            padding: 4px; gap: 3px; margin-bottom: 28px;
            box-shadow: 0 2px 10px rgba(181,129,58,0.07);
        }

        .sp-tab {
            display: flex; align-items: center; gap: 7px;
            background: transparent; border: none; border-radius: 30px;
            font-family: var(--font-body); font-size: 13px; font-weight: 600;
            color: var(--txt-3); padding: 8px 20px; cursor: pointer; text-decoration: none;
            transition: color 0.2s, background 0.2s;
        }
        .sp-tab:hover { color: var(--txt-2); background: var(--surf-2); }
        .sp-tab.active {
            background: linear-gradient(135deg, #c9a96e, #b5813a);
            color: #fff;
            box-shadow: 0 2px 10px rgba(181,129,58,0.28);
        }

        /* ── SECTION HEADING ── */
        .sp-sect-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .sp-sect-title {
            font-family: var(--font-head); font-size: 20px; font-weight: 600;
            font-style: italic; color: var(--txt-1);
        }
        .sp-badge {
            font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; background: var(--acc-soft);
            border-radius: 20px; padding: 3px 11px; color: var(--acc-deep);
            border: 1px solid var(--border-hi);
        }

        /* ── DIVIDER ── */
        .sp-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 4px 0 20px;
        }

        /* ── POST CARD ── */
        .post-card {
            background: var(--surf); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px;
            position: relative; overflow: hidden;
            box-shadow: 0 2px 12px rgba(181,129,58,0.07);
            transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
            animation: fadeUp 0.38s ease both;
        }
        .post-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #c9a96e, #d4a574, #a8b89a);
            border-radius: var(--radius) var(--radius) 0 0;
            opacity: 0; transition: opacity 0.25s;
        }
        .post-card:hover {
            border-color: var(--border-hi); transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(181,129,58,0.14);
        }
        .post-card:hover::after { opacity: 1; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .post-card:nth-child(1){animation-delay:0.05s}
        .post-card:nth-child(2){animation-delay:0.10s}
        .post-card:nth-child(3){animation-delay:0.15s}
        .post-card:nth-child(4){animation-delay:0.20s}
        .post-card:nth-child(5){animation-delay:0.25s}

        .pc-header { display: flex; align-items: center; gap: 12px; }
        .pc-avatar {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #c9a96e, #d4a574);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-body); font-size: 14px; font-weight: 700; color: #fff;
            box-shadow: 0 2px 8px rgba(201,169,110,0.3);
        }
        .pc-meta { flex: 1; min-width: 0; }
        .username {
            font-family: var(--font-body); font-size: 14px; font-weight: 700;
            color: var(--txt-1); display: block;
        }
        .timestamp {
            font-size: 11px; color: var(--txt-3); margin-top: 2px;
            display: flex; align-items: center; gap: 4px; font-weight: 500;
        }

        .content {
            font-size: 14px; line-height: 1.75; color: var(--txt-2); font-weight: 500;
            margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
        }

        .metrics {
            display: flex; align-items: center; gap: 10px;
            margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--border);
        }
        .metric-pill {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 700; color: var(--txt-3);
            background: var(--surf-2); border: 1px solid var(--border);
            border-radius: 20px; padding: 4px 12px;
            transition: background 0.2s;
        }
        .metric-pill i { font-size: 12px; color: var(--acc); }
        .metric-pill.cmt i { color: var(--sage); }
        .metric-pill:hover { background: var(--acc-soft); }
        .metric-pill.cmt:hover { background: var(--sage-soft); }

        /* ── EMPTY STATE ── */
        .sp-empty {
            text-align: center; padding: 70px 24px;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }
        .sp-empty-icon {
            width: 64px; height: 64px; border-radius: 20px;
            background: var(--acc-soft); border: 1px solid var(--border-hi);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--acc);
        }
        .sp-empty h3 {
            font-family: var(--font-head); font-size: 20px; font-weight: 600;
            font-style: italic; color: var(--txt-2);
        }
        .sp-empty p { font-size: 13px; color: var(--txt-3); max-width: 260px; font-weight: 500; }

        @media (max-width: 580px) {
            .sp-nav { padding: 0 18px; }
            .sp-wrap { padding: 24px 14px 60px; }
            .sp-greeting h1 { font-size: 26px; }
        }
    </style>
</head>

<body th:class="'theme-' + ${theme}">

<!-- NAVBAR -->
<nav class="sp-nav">
    <a href="/dashboard" class="sp-brand">
        <div class="sp-brand-blossom"><span>✦</span></div>
        SocialApp
    </a>
    <div class="sp-nav-right">
        <div class="sp-chip">
            <div class="sp-chip-avatar"
                 th:text="${username != null ? #strings.toUpperCase(#strings.substring(username,0,1)) : 'U'}">U</div>
            <span th:text="${username}">User</span>
        </div>
        <a href="/logout" class="sp-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</nav>

<div class="sp-wrap">

    <!-- GREETING -->
    <div class="sp-greeting">
        <h1 th:text="'Welcome back, ' + ${username} + ' ✦'">Welcome back ✦</h1>
        <p>Here's what's happening in your world today.</p>
    </div>

    <!-- THEME SWITCHER -->
    <div class="theme-switcher">
        <span class="theme-label">Theme</span>
        <a href="?type=feed&theme=light" class="theme-dot t-light" title="Light"></a>
        <a href="?type=feed&theme=dark"  class="theme-dot t-dark"  title="Dark"></a>
        <a href="?type=feed&theme=blue"  class="theme-dot t-blue"  title="Blue"></a>
    </div>

    <!-- TABS -->
    <div class="sp-tabs">
        <a href="/dashboard?type=feed"
           class="sp-tab"
           th:classappend="${type == 'feed' or type == null} ? ' active' : ''">
            <i class="bi bi-newspaper"></i> My Feed
        </a>
        <a href="/dashboard?type=trending"
           class="sp-tab"
           th:classappend="${type == 'trending'} ? ' active' : ''">
            <i class="bi bi-graph-up-arrow"></i> Trending
        </a>
    </div>

    <!-- SECTION HEADING -->
    <div class="sp-sect-head">
        <span class="sp-sect-title"
              th:text="${type == 'trending'} ? 'Trending Now' : 'Your Feed'">Your Feed</span>
        <span class="sp-badge"
              th:text="${type == 'trending'} ? 'Popular' : 'Latest'">Latest</span>
    </div>
    <div class="sp-divider"></div>

    <!-- EMPTY -->
    <div th:if="${posts == null or posts.isEmpty()}" class="sp-empty">
        <div class="sp-empty-icon"><i class="bi bi-flower1"></i></div>
        <h3>Nothing here yet</h3>
        <p>No posts available for this feed right now.</p>
    </div>

    <!-- POST CARDS -->
    <div th:each="post : ${posts}" class="post-card">
        <div class="pc-header">
            <div class="pc-avatar"
                 th:text="${post.username != null ? #strings.toUpperCase(#strings.substring(post.username,0,1)) : '?'}">?</div>
            <div class="pc-meta">
                <span class="username" th:text="${post.username}">Username</span>
                <span class="timestamp">
                    <i class="bi bi-clock"></i>
                    <span th:text="${post.timestamp}">Just now</span>
                </span>
            </div>
        </div>
        <div class="content" th:text="${post.content}">Post content</div>
        <div class="metrics">
            <span class="metric-pill">
                <i class="bi bi-hand-thumbs-up"></i>
                <span th:text="${post.likeCount}">0</span>
            </span>
            <span class="metric-pill cmt">
                <i class="bi bi-chat-dots"></i>
                <span th:text="${post.commentCount}">0</span>
            </span>
        </div>
    </div>

</div>

</body>
</html>
